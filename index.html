<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta itemprop="logo" content="/logo.svg" />
    <meta property="og:logo" content="/logo.svg" />

    <!-- Primary Meta Tags -->
    <title>Fluiq — The AI Ops Stack for LLM Applications</title>
    <meta name="title" content="Fluiq — The AI Ops Stack for LLM Applications" />
    <!-- Per-route meta description is injected by react-helmet-async (see each page's <Helmet>).
         Do NOT hardcode a description here — it would duplicate onto every prerendered route. -->
    <meta name="keywords" content="AI Ops, LLM monitoring, AI observability, prompt injection detection, LLM cost tracking, LLM evaluation, LLM caching, OpenAI tracing, Anthropic tracing, LangChain monitoring, LangGraph monitoring, GoogleADK monitoring, CrewAI monitoring, AI security, hallucination detection" />
    <meta name="robots" content="index, follow" />
    <!-- Per-route canonical is injected by react-helmet-async (see each page's <Helmet>).
         Do NOT hardcode a canonical here — it would emit a duplicate "/" canonical on every
         prerendered route and Google would collapse all pages onto the homepage. -->
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="preconnect" href="https://www.googletagmanager.com" />

    <!-- LLM crawler discovery — <link> (standard) + <meta> (fallback) -->
    <link rel="alternate" type="text/plain" title="LLM context (summary)" href="/llms.txt" />
    <link rel="alternate" type="text/plain" title="LLM context (full reference)" href="/llms-full.txt" />
    <meta name="llms-txt" content="https://getfluiq.com/llms.txt" />
    <meta name="llms-full-txt" content="https://getfluiq.com/llms-full.txt" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <!-- Per-route og:url is injected by react-helmet-async (see each page's <Helmet>/<Seo>).
         Do NOT hardcode og:url here — it would duplicate onto every prerendered route. -->
    <!-- Per-route og:title / og:description are injected by react-helmet-async (see each page's <Helmet>).
         Do NOT hardcode them here — they would duplicate onto every prerendered route. -->
    <meta property="og:image" content="https://getfluiq.com/banner.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Fluiq — The AI Ops Stack for LLM Applications" />
    <meta property="og:site_name" content="Fluiq" />

    <!-- X (Twitter) -->
    <meta property="twitter:card" content="summary_large_image" />
    <!-- twitter:title / twitter:description intentionally omitted — X/Twitter falls back to
         the per-route og:title / og:description injected by react-helmet-async. -->
    <meta property="twitter:image" content="https://getfluiq.com/banner.png" />
    <meta property="twitter:image:alt" content="Fluiq — The AI Ops Stack for LLM Applications" />

    <!-- JSON-LD: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Fluiq",
      "url": "https://getfluiq.com",
      "description": "The AI Ops stack for LLM applications — observe, secure, optimize, and evaluate every LLM call with two lines of Python.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://getfluiq.com/documentation",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Fluiq",
      "url": "https://getfluiq.com",
      "logo": "https://getfluiq.com/logo.svg",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "url": "https://getfluiq.com/contact",
        "availableLanguage": "English"
      },
      "sameAs": [
        "https://github.com/fluiq-AI/fluiq-sdk"
      ]
    }
    </script>

    <!-- JSON-LD: WebPage index -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebPage",
          "@id": "https://getfluiq.com/#home",
          "url": "https://getfluiq.com/",
          "name": "Fluiq — The AI Ops Stack for LLM Applications",
          "description": "Product overview: the four pillars of the Fluiq AI Ops stack (Observe, Secure, Optimize, Evaluate), supported integrations, code samples, and getting-started CTA.",
          "isPartOf": { "@id": "https://getfluiq.com" }
        },
        {
          "@type": "WebPage",
          "@id": "https://getfluiq.com/#documentation",
          "url": "https://getfluiq.com/documentation",
          "name": "Fluiq Documentation — Full SDK Reference",
          "description": "Complete SDK reference: installation, auto-instrumentation, @trace decorator, agent tracing, security scanning (fluiq.secure), optimization (fluiq.optimize), evaluation (fluiq.eval), prompt management, cost analytics, CI/CD integration, and configuration.",
          "isPartOf": { "@id": "https://getfluiq.com" }
        },
        {
          "@type": "ContactPage",
          "@id": "https://getfluiq.com/#contact",
          "url": "https://getfluiq.com/contact",
          "name": "Contact Fluiq",
          "description": "Contact the Fluiq team for sales enquiries, integration support, feature requests, and partnership discussions. Replies within one business day.",
          "isPartOf": { "@id": "https://getfluiq.com" }
        },
        {
          "@type": "WebPage",
          "@id": "https://getfluiq.com/#signup",
          "url": "https://getfluiq.com/signup",
          "name": "Sign up for Fluiq — Free, No Credit Card Required",
          "description": "Create a free Fluiq account and get an API key. Free tier includes 5 million lifetime traces and 1000 LLM-as-judge evaluations per month.",
          "isPartOf": { "@id": "https://getfluiq.com" }
        }
      ]
    }
    </script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FCNNKDRDX6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-FCNNKDRDX6');
    </script>
  </head>

    <div id="root"></div>

</html>
