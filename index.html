<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta itemprop="logo" content="/logo.svg" />
    <meta property="og:logo" content="/logo.svg" />

    <!-- Primary Meta Tags -->
    <!-- Per-route <title> is injected by react-helmet-async (see each page's <Helmet>).
         Every route — public/prerendered AND authenticated SPA routes (dashboard, auth,
         admin) — sets its own <title>, so none is hardcoded here. Hardcoding one would
         either duplicate onto every prerendered route or override the per-route title. -->
    <!-- Per-route meta description is injected by react-helmet-async (see each page's <Helmet>).
         Do NOT hardcode a description here — it would duplicate onto every prerendered route. -->
    <!-- Per-route meta keywords are injected by react-helmet-async (see each page's <Helmet>).
         Do NOT hardcode keywords here — it would emit the homepage keyword set onto every
         prerendered route instead of per-page-relevant terms. -->
    <meta name="robots" content="index, follow" />
    <!-- Per-route canonical is injected by react-helmet-async (see each page's <Helmet>).
         Do NOT hardcode a canonical here — it would emit a duplicate "/" canonical on every
         prerendered route and Google would collapse all pages onto the homepage. -->
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="preconnect" href="https://www.googletagmanager.com" />

    <!-- LLM crawler discovery — <link> (standard) + <meta> (fallback) -->
    <link rel="alternate" type="text/plain" title="LLM context (summary)" href="/llms.txt" />
    <link rel="alternate" type="text/plain" title="LLM context (full reference)" href="/llms-full.txt" />
    <meta name="llms-txt" content="https://getfluiq.com/llms.txt" />
    <meta name="llms-full-txt" content="https://getfluiq.com/llms-full.txt" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <!-- Per-route og:url is injected by react-helmet-async (see each page's <Helmet>/<Seo>).
         Do NOT hardcode og:url here — it would duplicate onto every prerendered route. -->
    <!-- Per-route og:title / og:description are injected by react-helmet-async (see each page's <Helmet>).
         Do NOT hardcode them here — they would duplicate onto every prerendered route. -->
    <meta property="og:image" content="https://getfluiq.com/banner.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Fluiq — The AI Ops Stack for LLM Applications" />
    <meta property="og:site_name" content="Fluiq" />

    <!-- X (Twitter) -->
    <meta property="twitter:card" content="summary_large_image" />
    <!-- twitter:title / twitter:description intentionally omitted — X/Twitter falls back to
         the per-route og:title / og:description injected by react-helmet-async. -->
    <meta property="twitter:image" content="https://getfluiq.com/banner.png" />
    <meta property="twitter:image:alt" content="Fluiq — The AI Ops Stack for LLM Applications" />

    <!-- JSON-LD: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Fluiq",
      "url": "https://getfluiq.com",
      "description": "The AI Ops stack for LLM applications — observe, secure, optimize, and evaluate every LLM call with two lines of Python.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://getfluiq.com/documentation",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Fluiq",
      "url": "https://getfluiq.com",
      "logo": "https://getfluiq.com/logo.svg",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "url": "https://getfluiq.com/contact",
        "availableLanguage": "English"
      },
      "sameAs": [
        "https://github.com/fluiq-AI/fluiq-sdk"
      ]
    }
    </script>

    <!-- Per-route WebPage / SoftwareApplication / TechArticle JSON-LD is injected by
         react-helmet-async (see each page's <Helmet>). Only the site-wide WebSite and
         Organization graphs above are hardcoded here; a per-page WebPage @graph must NOT
         be hardcoded or every prerendered route would carry the homepage's structured data. -->

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FCNNKDRDX6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-FCNNKDRDX6');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
