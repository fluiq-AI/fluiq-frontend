version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Next.js 16 needs Node >= 20.9 (Amplify's default image may be older).
        - nvm use 20 || nvm install 20
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    # Amplify's managed Next.js SSR adapter consumes the .next output (the branch
    # framework must be "Next.js - SSR" and the app platform WEB_COMPUTE).
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
