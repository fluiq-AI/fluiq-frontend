version: 1
frontend:
  phases:
    preBuild:
      commands:
        # The build-time prerender (@prerenderer/renderer-puppeteer) launches
        # headless Chromium, which Amplify's build image doesn't ship. Install
        # Google Chrome (dnf resolves its system libs). PUPPETEER_EXECUTABLE_PATH
        # + PUPPETEER_SKIP_DOWNLOAD are set as Amplify env vars so puppeteer uses
        # this binary instead of downloading its own.
        - dnf install -y https://dl.google.com/linux/direct/google-chrome-stable_current_x86_64.rpm
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
