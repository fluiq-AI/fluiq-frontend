version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Next.js 16 needs Node >= 20.9 (Amplify's default image may be older).
        - nvm use 20 || nvm install 20
        # Next.js SSR build — no headless Chromium / puppeteer prerender needed
        # anymore (per-route metadata is rendered server-side by the App Router).
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    # Amplify auto-detects Next.js and provisions SSR compute from the .next output.
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
# NOTE: set NEXT_PUBLIC_API_BASE_URL in the Amplify console env vars (replaces
# the old VITE_API_BASE_URL). The previous PUPPETEER_* build env vars are no
# longer used and can be removed.
