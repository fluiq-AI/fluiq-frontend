version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Next.js 16 needs Node >= 20.9 (Amplify's default image may be older).
        - nvm use 20 || nvm install 20
        - npm ci
    build:
      commands:
        - npm run build
        # Assemble the WEB_COMPUTE deploy bundle ourselves from Next's standalone
        # output. Amplify's managed Next.js adapter doesn't recognize Next 16 yet,
        # so this produces .amplify-hosting/deploy-manifest.json explicitly.
        - node scripts/amplify-hosting.mjs
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
